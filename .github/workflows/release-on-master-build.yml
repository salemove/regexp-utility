name: Release on master build

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  # Common versions
  GO_VERSION: '1.26.5'
  GOLANGCI_LINT_VERSION: 'v2.11.3'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # Don't restore a cache into the release build.

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run quality control checks
        run: make vet

      - name: Run tests
        run: make test

      - name: Create releases directory
        run: mkdir releases

      - name: Build for Linux (amd64)
        run: make build OUTPUT_PATH=releases/regexp_utility-$GOOS-$GOARCH
        env:
          GOOS: linux
          GOARCH: amd64

      - name: Build for Linux (arm64)
        run: make build OUTPUT_PATH=releases/regexp_utility-$GOOS-$GOARCH
        env:
          GOOS: linux
          GOARCH: arm64

      - name: Build for Intel based Macs (amd64)
        run: make build OUTPUT_PATH=releases/regexp_utility-$GOOS-$GOARCH
        env:
          GOOS: darwin
          GOARCH: amd64

      - name: Build for Apple Silicon based Macs (arm64)
        run: make build OUTPUT_PATH=releases/regexp_utility-$GOOS-$GOARCH
        env:
          GOOS: darwin
          GOARCH: arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="release-$(git rev-parse --short "$GITHUB_SHA")"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            releases/regexp_utility-linux-amd64 \
            releases/regexp_utility-linux-arm64 \
            releases/regexp_utility-darwin-amd64 \
            releases/regexp_utility-darwin-arm64
